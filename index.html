<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f5f5f5; }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .header { background: linear-gradient(135deg, #1F4E78 0%, #2E75B6 100%); color: white; padding: 20px; text-align: center; position: relative; }
    .header h1 { font-size: 32px; margin-bottom: 5px; }
    .menu-btn { position: absolute; left: 20px; top: 15px; background: rgba(255,255,255,0.2); border: 2px solid white; color: white; font-size: 24px; cursor: pointer; padding: 8px 12px; border-radius: 4px; transition: all 0.3s; }
    .menu-btn:hover { background: rgba(255,255,255,0.3); }
    .side-menu { position: fixed; left: -300px; top: 0; width: 280px; height: 100vh; background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.2); z-index: 999; transition: left 0.3s; padding-top: 80px; }

    .menu-item { display: block; width: 100%; padding: 15px 20px; border: none; background: none; text-align: left; cursor: pointer; font-size: 15px; border-bottom: 1px solid #f0f0f0; transition: all 0.2s; }
    .menu-item:hover { background: #f5f5f5; padding-left: 30px; }
    .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 998; }
    .navbar { display: flex; background: #f9f9f9; border-bottom: 1px solid #ddd; gap: 0; }
    .navbar button { padding: 12px 20px; border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s; }
    .navbar button.active { color: #2E75B6; border-bottom-color: #2E75B6; }
    .navbar .exit-btn { margin-left: auto; color: #d32f2f; }
    .main { flex: 1; overflow-y: auto; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none; }
    .container.active { display: block; }
    .footer { background: #f5f5f5; border-top: 1px solid #ddd; padding: 12px 20px; text-align: center; font-size: 12px; color: #666; font-weight: 500; }

    .form-group select { cursor: pointer; }

    .btn-primary { background: #2E75B6; color: white; padding: 12px 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    .btn-primary:hover { background: #1F4E78; }
    .btn-secondary { background: #666; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 20px; }
    .btn-secondary:hover { background: #555; }
    .btn-success { background: #4CAF50; color: white; padding: 12px 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-left: 10px; }
    .btn-success:hover { background: #45a049; }
    .project-header { border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
    .project-header h2 { margin-bottom: 10px; }
    .header-buttons { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
    .projects-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .projects-table th { background: #f0f0f0; padding: 12px; text-align: left; border-bottom: 2px solid #ddd; font-weight: 600; }
    .projects-table td { padding: 12px; border-bottom: 1px solid #eee; }
    .surveys-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .surveys-table th { background: #f0f0f0; padding: 12px; text-align: left; border-bottom: 2px solid #ddd; font-weight: 600; }
    .surveys-table td { padding: 12px; border-bottom: 1px solid #eee; }
    .surveys-table .width-height { font-weight: 600; color: #1F4E78; }
    .btn-small { background: #2E75B6; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 5px; }
    .btn-small:hover { background: #1F4E78; }
    .btn-delete { background: #d32f2f; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }

    .toolbar button { padding: 8px 12px; background: white; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 13px; }

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://tyhybxxbhgyuswlizrmc.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5aHlieHhiaGd5dXN3bGl6cm1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDY0MzQsImV4cCI6MjA5NjU4MjQzNH0.2kz4T1qcreDeZXhs4AJDwx8Ur-Tpww6oRB5z3jDv4Es';

    let projects = JSON.parse(localStorage.getItem('eurosurvey_projects') || '[]');
    let surveys = JSON.parse(localStorage.getItem('eurosurvey_surveys') || '[]');
    let currentProject = null;
    let currentSurvey = null;
    let photosData = [];

    // Convert object keys to lowercase for Supabase
    function toLowerCaseKeys(obj) {
      if (!obj || typeof obj !== 'object') return obj;
      const newObj = {};
      for (const key in obj) {
        newObj[key.toLowerCase()] = obj[key];
      }
      return newObj;
    }

    // Convert lowercase keys back to camelCase (from Supabase)
    function toCamelCaseKeys(obj) {
      if (!obj || typeof obj !== 'object') return obj;
      const newObj = {};
      for (const key in obj) {
        // Convert lowercase to camelCase
        const camelKey = key.replace(/_([a-z])/g, (g) => g[1].toUpperCase());
        newObj[camelKey] = obj[key];
      }
      return newObj;
    }

    // Supabase API helper - simplified for better reliability
    async function supabaseCall(table, method, data = null, id = null) {
      try {
        let url = `${SUPABASE_URL}/rest/v1/${table}`;
        let options = {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          }
        };

        if (method === 'GET') {
          url += '?select=*';
          options.method = 'GET';
        } else if (method === 'POST') {
          options.method = 'POST';
          const lowercaseData = toLowerCaseKeys(data);
          options.body = JSON.stringify(lowercaseData);
          console.log(`📤 POST to ${table}:`, lowercaseData);
        } else if (method === 'UPDATE') {
          url += `?id=eq.${id}`;
          options.method = 'PATCH';
          const lowercaseData = toLowerCaseKeys(data);
          options.body = JSON.stringify(lowercaseData);
          console.log(`📤 PATCH to ${table}:`, lowercaseData);
        } else if (method === 'DELETE') {
          url += `?id=eq.${id}`;
          options.method = 'DELETE';
          console.log(`📤 DELETE from ${table}:`, id);
        }

        const response = await fetch(url, options);
        const responseText = await response.text();

        if (response.ok) {
          console.log(`✅ ${method} success:`, responseText);
          return method === 'DELETE' ? true : JSON.parse(responseText);
        } else {
          console.error(`❌ ${method} failed - Status ${response.status}:`, responseText);
          throw new Error(`Status ${response.status}: ${responseText}`);
        }
      } catch (error) {
        console.error('❌ Supabase error:', error.message);
        return null;
      }
    }

    // Load all data from Supabase on startup
    async function loadFromSupabase() {
      try {
        console.log('🔄 Loading from Supabase...', SUPABASE_URL);
        const projectsData = await supabaseCall('projects', 'GET');
        console.log('📦 Projects from Supabase:', projectsData);

        const surveysData = await supabaseCall('surveys', 'GET');
        console.log('📦 Surveys from Supabase:', surveysData);

        if (projectsData && Array.isArray(projectsData) && projectsData.length > 0) {
          console.log('✅ Loaded', projectsData.length, 'projects from Supabase');
          // Convert lowercase keys back to camelCase
          projects = projectsData.map(p => toCamelCaseKeys(p));
          localStorage.setItem('eurosurvey_projects', JSON.stringify(projects));
        } else {
          console.log('⚠️ No projects in Supabase, using local data');
        }

        if (surveysData && Array.isArray(surveysData) && surveysData.length > 0) {
          console.log('✅ Loaded', surveysData.length, 'surveys from Supabase');
          // Convert lowercase keys back to camelCase
          surveys = surveysData.map(s => toCamelCaseKeys(s));
          localStorage.setItem('eurosurvey_surveys', JSON.stringify(surveys));
        } else {
          console.log('⚠️ No surveys in Supabase, using local data');
        }
      } catch (error) {
        console.error('❌ Error loading from Supabase:', error);
      }

    const drawingTool = {
      canvas: null,
      ctx: null,
      isDrawing: false,
      currentTool: 'freehand',
      color: '#000000',
      brushSize: 2,
      startX: 0,
      startY: 0,
      autoSaveTimeout: null,

      init() {
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.ctx.fillStyle = 'white';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
        this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
        this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));
        this.canvas.addEventListener('mouseout', (e) => this.handleMouseUp(e));
      },

      setTool(tool) { this.currentTool = tool; },
      setColor(color) { this.color = color; },
      setBrushSize(size) { this.brushSize = size; },

      handleMouseDown(e) {
        this.isDrawing = true;
        const rect = this.canvas.getBoundingClientRect();
        this.startX = e.clientX - rect.left;
        this.startY = e.clientY - rect.top;

        if (this.currentTool === 'freehand') {
          this.ctx.beginPath();
          this.ctx.moveTo(this.startX, this.startY);
        }
      },

      handleMouseMove(e) {
        if (!this.isDrawing) return;
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (this.currentTool === 'freehand') {
          this.ctx.strokeStyle = this.color;
          this.ctx.lineWidth = this.brushSize;
          this.ctx.lineCap = 'round';
          this.ctx.lineJoin = 'round';
          this.ctx.lineTo(x, y);
          this.ctx.stroke();
        }
      },

      handleMouseUp(e) {
        if (!this.isDrawing) return;
        this.isDrawing = false;

        const rect = this.canvas.getBoundingClientRect();
        const endX = e.clientX - rect.left;
        const endY = e.clientY - rect.top;

        if (this.currentTool === 'rectangle') {
          this.ctx.strokeStyle = this.color;
          this.ctx.lineWidth = this.brushSize;
          this.ctx.strokeRect(this.startX, this.startY, endX - this.startX, endY - this.startY);
        } else if (this.currentTool === 'circle') {
          const radius = Math.sqrt(Math.pow(endX - this.startX, 2) + Math.pow(endY - this.startY, 2));
          this.ctx.strokeStyle = this.color;
          this.ctx.lineWidth = this.brushSize;
          this.ctx.beginPath();
          this.ctx.arc(this.startX, this.startY, radius, 0, 2 * Math.PI);
          this.ctx.stroke();
        }

        this.autoSaveSketch();
      },

      autoSaveSketch() {
        clearTimeout(this.autoSaveTimeout);
        this.autoSaveTimeout = setTimeout(() => {
          if (currentSurvey) {
            currentSurvey.sketchData = this.canvas.toDataURL('image/png');
            saveSurvey();
          }
        }, 500);
      },

      addDimension() {
        const width = prompt('Enter width (mm):');
        if (!width) return;
        const height = prompt('Enter height (mm):');
        if (!height) return;

        this.ctx.fillStyle = '#FF0000';
        this.ctx.font = 'bold 16px Arial';
        this.ctx.fillText(`W: ${width}mm × H: ${height}mm`, 20, 40);
        this.autoSaveSketch();
      },

      addText() {
        const text = prompt('Enter text:');
        if (!text) return;

        this.ctx.fillStyle = this.color;
        this.ctx.font = '16px Arial';
        this.ctx.fillText(text, 20, 60);
        this.autoSaveSketch();
      },

      clearCanvas() {
        if (confirm('Clear all drawings?')) {
          this.ctx.fillStyle = 'white';
          this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        }
      },

      async saveSketch() {
        if (currentSurvey) {
          try {
            const canvas = this.canvas;
            canvas.toBlob(async (blob) => {
              // Upload to Supabase Storage
              const fileName = `sketches/${currentSurvey.id}_${Date.now()}.png`;
              const uploadUrl = `${SUPABASE_URL}/storage/v1/object/survey-files/${fileName}`;

              const response = await fetch(uploadUrl, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${SUPABASE_KEY}`,
                  'apikey': SUPABASE_KEY
                },
                body: blob
              });

              if (response.ok) {
                currentSurvey.sketchData = `${SUPABASE_URL}/storage/v1/object/public/survey-files/${fileName}`;
                saveSurvey();
                alert('✅ Sketch saved!');
              } else {
                alert('Failed to save sketch');
              }
            }, 'image/png');
          } catch(e) {
            alert('Error saving sketch: ' + e.message);
          }
        }
      },

      loadSketch(sketchData) {
        if (sketchData) {
          const self = this;
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            self.ctx.clearRect(0, 0, self.canvas.width, self.canvas.height);
            self.ctx.drawImage(img, 0, 0);
          };
          img.onerror = () => {
            console.error('Failed to load sketch image');
            self.ctx.fillStyle = 'white';
            self.ctx.fillRect(0, 0, self.canvas.width, self.canvas.height);
          };
          img.src = sketchData;
        } else {
          this.ctx.fillStyle = 'white';
          this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        }
      }
    };

    function deleteProject(projectId) {
      const project = projects.find(p => p.id === projectId);
      if (!project) return;

      if (!confirm(`Delete project "${project.projectName}" and all its surveys? This cannot be undone.`)) {
        return;
      }

      // Delete all surveys for this project from Supabase
      const projectSurveys = surveys.filter(s => s.projectId === projectId);
      projectSurveys.forEach(survey => {
        supabaseCall('surveys', 'DELETE', null, survey.id).catch(err => console.error('Failed to delete survey:', err));
      });

      // Delete all surveys locally
      surveys = surveys.filter(s => s.projectId !== projectId);
      localStorage.setItem('eurosurvey_surveys', JSON.stringify(surveys));

      // Delete the project from Supabase
      supabaseCall('projects', 'DELETE', null, projectId).catch(err => console.error('Failed to delete project:', err));

      // Delete the project locally
      projects = projects.filter(p => p.id !== projectId);
      localStorage.setItem('eurosurvey_projects', JSON.stringify(projects));

      // Refresh the list
      renderProjectsList();
    }

    function renderSurveysList() {

      const projectSurveys = surveys.filter(s => s.projectId === currentProject.id);

      if (projectSurveys.length === 0) {
        list.innerHTML = '<p>No surveys yet. Click "+ New Survey" to start surveying locations.</p>';
        return;

      let html = '<table class="surveys-table"><thead><tr><th>Location</th><th>Product Type</th><th>Width (mm)</th><th>Height (mm)</th><th>Notes</th><th>Action</th></tr></thead><tbody>';
      projectSurveys.sort((a, b) => new Date(b.createdDate) - new Date(a.createdDate)).forEach(s => {
        const notePreview = s.notes ? s.notes.substring(0, 30) + (s.notes.length > 30 ? '...' : '') : '—';
        html += `<tr><td><strong>${s.locationName}</strong></td><td>${s.productType || '—'}</td><td class="width-height">${s.width}</td><td class="width-height">${s.height}</td><td>${notePreview}</td><td><button onclick="viewSurvey('${s.id}')" class="btn-small" style="background: #1976D2;">View</button><button onclick="openSurvey('${s.id}')" class="btn-small">Edit</button><button onclick="deleteSurveyConfirm('${s.id}')" class="btn-delete">Delete</button></td></tr>`;

    function openSurvey(surveyId) {
      const survey = surveys.find(s => s.id === surveyId);
      if (!survey) return;

      currentSurvey = survey;
      photosData = survey.photosData || [];

      const project = projects.find(p => p.id === survey.projectId);
      document.getElementById('surveyTitle').textContent = `${project.projectName} - Survey`;
      document.getElementById('surveyLocation').value = survey.locationName || '';
      document.getElementById('surveyProductType').value = survey.productType || '';
      document.getElementById('surveyPanelType').value = survey.panelType || '';
      document.getElementById('surveyHandleType').value = survey.handleType || '';
      document.getElementById('surveyHandleLength').value = survey.handleLength || '';
      document.getElementById('surveyHandleColor').value = survey.handleColor || '';
      document.getElementById('surveySmartLock').checked = survey.smartLock || false;
      document.getElementById('surveyWidth').value = survey.width || '';
      document.getElementById('surveyHeight').value = survey.height || '';
      document.getElementById('surveyNotes').value = survey.notes || '';

      // Update conditional fields
      updateConditionalFields();
      updateHandleFields();

      document.getElementById('photosGallery').innerHTML = '';
      photosData.forEach(photo => {
        const img = document.createElement('img');
        // Support both new URL format and old base64 format
        img.src = photo.url || photo.data;
        document.getElementById('photosGallery').appendChild(img);

      drawingTool.init();
      drawingTool.loadSketch(survey.sketchData);

      document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));
      document.getElementById('survey-view').classList.add('active');
      updateMenuButtons();

    function saveSurveyDetails() {
      const location = document.getElementById('surveyLocation').value.trim();
      const productType = document.getElementById('surveyProductType').value.trim();
      const width = document.getElementById('surveyWidth').value.trim();
      const height = document.getElementById('surveyHeight').value.trim();
      const panelType = document.getElementById('surveyPanelType').value.trim();
      const handleType = document.getElementById('surveyHandleType').value.trim();

      if (!location || !productType || !width || !height) {
        alert('Please fill in Location, Product Type, Width, and Height');
        return;
      }

      // Check if conditional fields are required
      if ((productType.includes('hinged') || productType.includes('Pivot')) && !panelType) {
        alert('Please select Panel Type');
        return;
      }

      if (productType === 'Schuco Front Door') {
        if (!panelType) {
          alert('Please fill in Panel Type for Front Door');
          return;
        }
        if (!handleType) {
          alert('Please fill in Handle Type for Front Door');
          return;
        }
        const handleColor = document.getElementById('surveyHandleColor').value.trim();
        if (!handleColor) {
          alert('Please fill in Handle Color for Front Door');
          return;
        }
      }

      currentSurvey.locationName = location;
      currentSurvey.productType = productType;
      currentSurvey.panelType = panelType;
      currentSurvey.handleType = handleType;
      currentSurvey.handleLength = document.getElementById('surveyHandleLength').value.trim();
      currentSurvey.handleColor = document.getElementById('surveyHandleColor').value.trim();
      currentSurvey.smartLock = document.getElementById('surveySmartLock').checked;
      currentSurvey.width = parseInt(width);
      currentSurvey.height = parseInt(height);

      if (drawingTool.canvas) {
        currentSurvey.sketchData = drawingTool.canvas.toDataURL('image/png');
      }

      saveSurvey();
      alert('✅ Survey details saved!');
    }

      }

      html += `<hr style="margin: 20px 0;"><h3>Dimensions Summary</h3>
        <table class="surveys-table" style="width: 100%;">
        <thead><tr><th>Location</th><th>Product Type</th><th>Width (mm)</th><th>Height (mm)</th><th>Notes</th></tr></thead><tbody>`;

      projectSurveys.forEach(s => {
        const notePreview = s.notes ? s.notes.substring(0, 30) : '—';
        html += `<tr><td>${s.locationName}</td><td>${s.productType || '—'}</td><td>${s.width}</td><td>${s.height}</td><td>${notePreview}</td></tr>`;
      });

      html += `</tbody></table><hr style="margin: 20px 0;">`;

      projectSurveys.forEach((survey, index) => {
        html += `<div style="page-break-after: always; padding: 20px 0; border-bottom: 2px solid #ddd; margin-bottom: 20px;">
          <h3>Location ${index + 1}: ${survey.locationName}</h3>
          <p><strong>Product Type:</strong> ${survey.productType}</p>`;

        if (survey.panelType) html += `<p><strong>Panel Type:</strong> ${survey.panelType}</p>`;
        if (survey.handleType) {
          html += `<p><strong>Handle Type:</strong> ${survey.handleType}</p>`;
          if (survey.handleLength) html += `<p><strong>Handle Length:</strong> ${survey.handleLength}</p>`;
          if (survey.handleColor) html += `<p><strong>Handle Color:</strong> ${survey.handleColor}</p>`;
          if (survey.smartLock) html += `<p><strong>Smart Lock:</strong> Yes</p>`;
        }

        html += `<p><strong>Width:</strong> ${survey.width} mm</p>
          <p><strong>Height:</strong> ${survey.height} mm</p>
          <p><strong>Survey Date:</strong> ${new Date(survey.createdDate).toLocaleDateString()}</p>`;

        if (survey.notes) {
          html += `<p><strong>Notes:</strong> ${survey.notes}</p>`;
        }

        if (survey.sketchData) {
          html += `<h4>Site Sketch:</h4><img src="${survey.sketchData}" style="max-width: 100%; border: 1px solid #ddd; margin: 10px 0;">`;
        }

        if (survey.photosData && survey.photosData.length > 0) {
          html += `<h4>Photos:</h4><div style="display: flex; gap: 10px; flex-wrap: wrap;">`;
          survey.photosData.forEach(photo => {
            const src = photo.url || photo.data;
            if (src) {
              html += `<img src="${src}" style="max-width: 200px; max-height: 200px; border-radius: 4px;">`;
            }
          });
          html += `</div>`;
        }

        html += `</div>`;
      });

      document.getElementById('reportContent').innerHTML = html;
      showView('report');
    }

    function saveSurvey() {
      // Save all form fields
      currentSurvey.locationName = document.getElementById('surveyLocation').value;
      currentSurvey.productType = document.getElementById('surveyProductType').value;
      currentSurvey.panelType = document.getElementById('surveyPanelType').value;
      currentSurvey.handleType = document.getElementById('surveyHandleType').value;
      currentSurvey.handleLength = document.getElementById('surveyHandleLength').value;
      currentSurvey.handleColor = document.getElementById('surveyHandleColor').value;
      currentSurvey.smartLock = document.getElementById('surveySmartLock').checked;
      currentSurvey.width = document.getElementById('surveyWidth').value;
      currentSurvey.height = document.getElementById('surveyHeight').value;
      currentSurvey.notes = document.getElementById('surveyNotes').value;
      currentSurvey.photosData = photosData;

      const index = surveys.findIndex(s => s.id === currentSurvey.id);
      if (index >= 0) {
        surveys[index] = currentSurvey;
      }
      localStorage.setItem('eurosurvey_surveys', JSON.stringify(surveys));

      // Save to Supabase (exclude large binary data)
      const supabaseData = { ...currentSurvey, sketchData: null, photosData: null };
      supabaseCall('surveys', 'UPDATE', supabaseData, currentSurvey.id).catch(err => console.error('Failed to update survey in Supabase:', err));
    }

    async function handlePhotoUpload(e) {
      const files = Array.from(e.target.files);
      for (let file of files) {
        // Upload to Supabase Storage
        const fileName = `${currentSurvey.id}/${Date.now()}_${file.name}`;
        const uploadUrl = `${SUPABASE_URL}/storage/v1/object/survey-files/${fileName}`;

        const formData = new FormData();
        formData.append('file', file);

        try {
          const response = await fetch(uploadUrl, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'apikey': SUPABASE_KEY
            },
            body: file
          });

          if (response.ok) {
            const fileUrl = `${SUPABASE_URL}/storage/v1/object/public/survey-files/${fileName}`;
            const photoData = { url: fileUrl, name: file.name };
            photosData.push(photoData);
            saveSurvey();

            // Display the image from URL
            const img = document.createElement('img');
            img.src = fileUrl;
            document.getElementById('photosGallery').appendChild(img);
          }
        } catch (error) {
          console.error('Upload error:', error);
          alert('Failed to upload file');
        }
      }
    }

    function generateProjectPDF() {
      // Save current survey data first
      if (currentSurvey) {
        saveSurvey();
      }

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();
      let yPos = 10;

      const projectSurveys = surveys.filter(s => s.projectId === currentProject.id);

      if (projectSurveys.length === 0) {
        alert('No surveys to generate report. Please add surveys first.');
        return;
      }

      pdf.setFontSize(24);
      pdf.text('SURVEY REPORT', 10, yPos);
      yPos += 20;

      pdf.setFontSize(14);
      pdf.text(currentProject.projectName, 10, yPos);
      yPos += 10;

      pdf.setFontSize(11);
      pdf.text(`Project #: ${currentProject.projectNumber}`, 10, yPos);
      yPos += 7;
      pdf.text(`Contact: ${currentProject.contactName}`, 10, yPos);
      yPos += 7;
      pdf.text(`Address: ${currentProject.siteAddress}`, 10, yPos);
      yPos += 7;
      pdf.text(`Pre-installation Site Visit: ${currentProject.preInstallationRequired || 'No'}`, 10, yPos);
      yPos += 7;
      if (currentProject.preInstallationRequired === 'Yes' && currentProject.preInstallationDate) {
        pdf.text(`Proposed Date: ${new Date(currentProject.preInstallationDate).toLocaleDateString()}`, 10, yPos);
        yPos += 7;
      }
      pdf.text(`Report Date: ${new Date().toLocaleDateString()}`, 10, yPos);
      yPos += 15;

      if (currentProject.projectNotes) {
        pdf.setFontSize(10);
        const noteLines = pdf.splitTextToSize(`Notes: ${currentProject.projectNotes}`, 190);
        noteLines.forEach(line => {
          pdf.text(line, 10, yPos);
          yPos += 5;
        });
      }

      yPos += 10;
      pdf.setFontSize(12);
      pdf.text('DIMENSIONS SUMMARY', 10, yPos);
      yPos += 8;

      pdf.setFontSize(9);
      const colWidths = [45, 50, 25, 25, 45];
      const headers = ['Location', 'Product Type', 'Width (mm)', 'Height (mm)', 'Notes'];
      let xPos = 10;

      pdf.setFillColor(240, 240, 240);
      headers.forEach((header, i) => {
        pdf.rect(xPos, yPos, colWidths[i], 8, 'F');
        pdf.text(header, xPos + 2, yPos + 5);
        xPos += colWidths[i];
      });
      yPos += 8;

      projectSurveys.forEach(s => {
        const rowData = [
          s.locationName,
          s.productType || '—',
          `${s.width}`,
          `${s.height}`,
          s.notes ? s.notes.substring(0, 20) : '—'
        ];

        xPos = 10;
        rowData.forEach((cell, i) => {
          pdf.text(cell, xPos + 2, yPos + 5);
          pdf.rect(xPos, yPos, colWidths[i], 8);
          xPos += colWidths[i];
        });
        yPos += 8;
      });

      projectSurveys.forEach((survey, index) => {
        pdf.addPage();
        yPos = 10;

        pdf.setFontSize(14);
        pdf.text(`Location ${index + 1}: ${survey.locationName}`, 10, yPos);
        yPos += 10;

        pdf.setFontSize(11);
        pdf.text(`Product Type: ${survey.productType}`, 10, yPos);
        yPos += 7;

        if (survey.panelType) {
          pdf.text(`Panel Type: ${survey.panelType}`, 10, yPos);
          yPos += 7;
        }

        if (survey.handleType) {
          pdf.text(`Handle Type: ${survey.handleType}`, 10, yPos);
          yPos += 7;
          if (survey.handleLength) {
            pdf.text(`Handle Length: ${survey.handleLength}`, 10, yPos);
            yPos += 7;
          }
          if (survey.handleColor) {
            pdf.text(`Handle Color: ${survey.handleColor}`, 10, yPos);
            yPos += 7;
          }
          if (survey.smartLock) {
            pdf.text(`Smart Lock: Yes`, 10, yPos);
            yPos += 7;
          }
        }

        pdf.text(`Width: ${survey.width} mm`, 10, yPos);
        yPos += 7;
        pdf.text(`Height: ${survey.height} mm`, 10, yPos);
        yPos += 7;
        pdf.text(`Survey Date: ${new Date(survey.createdDate).toLocaleDateString()}`, 10, yPos);
        yPos += 15;

        if (survey.notes) {
          pdf.setFontSize(11);
          pdf.text('Notes:', 10, yPos);
          yPos += 7;
          pdf.setFontSize(10);
          const noteLines = pdf.splitTextToSize(survey.notes, 190);
          noteLines.forEach(line => {
            if (yPos > 250) { pdf.addPage(); yPos = 10; }
            pdf.text(line, 10, yPos);
            yPos += 5;
          });
          yPos += 10;
        }

        if (survey.sketchData) {
          if (yPos > 160) { pdf.addPage(); yPos = 10; }
          pdf.setFontSize(11);
          pdf.text('Site Sketch:', 10, yPos);
          yPos += 8;
          try {
            const imgData = survey.sketchData;
            if (imgData && imgData.length > 0) {
              pdf.addImage(imgData, 'PNG', 10, yPos, 180, 120);
              yPos += 130;
            }
          } catch(e) {
            console.error('Error adding sketch:', e);
            pdf.setFontSize(10);
            pdf.text('(Sketch image could not be loaded)', 10, yPos);
            yPos += 10;
          }
        }

        if (survey.photosData && survey.photosData.length > 0) {
          if (yPos > 180) { pdf.addPage(); yPos = 10; }
          pdf.setFontSize(11);
          pdf.text('Photos:', 10, yPos);
          yPos += 8;

          survey.photosData.forEach((photo, photoIndex) => {
            if (yPos > 180) { pdf.addPage(); yPos = 10; }
            try {
              if (photo.data && photo.data.length > 0) {
                pdf.addImage(photo.data, 'JPEG', 10, yPos, 180, 90);
                yPos += 100;
              }
            } catch(e) {
              console.error('Error adding photo:', e);
              pdf.setFontSize(10);
              pdf.text('(Photo ' + (photoIndex + 1) + ' could not be loaded)', 10, yPos);
              yPos += 10;
            }
          });
        }
      });

      const pageCount = pdf.getNumberOfPages();
      for (let i = 1; i <= pageCount; i++) {
        pdf.setPage(i);
        pdf.setFontSize(9);
        pdf.text(`Page ${i} of ${pageCount}`, 190, 285, { align: 'right' });
      }

      pdf.save(`${currentProject.projectName}_Complete_Survey.pdf`);
      alert('✅ Project report PDF generated!');
    }

    function exitApp() {
      if (confirm('Exit EuroSurvey?')) {
        window.close();
      }
    }

    drawingTool.init();
    renderProjectsList();
  </script>
